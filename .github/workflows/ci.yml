name: CI
on:
  push:
    branches: [main]
    paths: &inputs ['*.js', '*.cjs', '.github/workflows/ci.yml']
  pull_request:
    paths: *inputs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: player-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: player tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: node --test skelplayer_test.cjs skelcompat_test.cjs skelbatch_test.cjs
